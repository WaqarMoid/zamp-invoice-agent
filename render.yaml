services:
  - type: web
    name: zamp-invoice-agent-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: EXTRACTION_CACHE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
